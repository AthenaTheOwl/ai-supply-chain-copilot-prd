name: run-evidence-gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cdcp-gates:
    name: cdcp gates
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install python deps
        run: pip install pyyaml jsonschema

      - name: schema-cache freshness
        run: python scripts/check_schema_cache_freshness.py

      - name: voice lint
        run: python scripts/voice_lint.py

      - name: bom check
        run: python scripts/check_no_bom.py

      - name: validate decisions
        run: python scripts/validate_decisions.py

  prototype-build:
    name: prototype build and test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test
